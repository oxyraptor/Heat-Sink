name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set"
            exit 1
          fi

          git checkout main
          git reset --hard
          git clean -fdx

          # Remove existing sync branch if present, then create a clean orphan branch.
          git branch -D hf-space-sync 2>/dev/null || true

          # Build a clean sync branch with only the current tree (no history),
          # then exclude large/binary artifacts that Spaces rejects.
          git switch --orphan hf-space-sync
          git reset --hard main

          git rm --cached --ignore-unmatch backend/ml_models/*.pkl
          git rm --cached --ignore-unmatch backend/ml_models/inverse_model.pkl
          git rm --cached --ignore-unmatch docs/PDF/*.pdf
          
          # Physically remove from disk so 'git add -A' doesn't pick them back up
          rm -rf backend/ml_models/*.pkl
          rm -rf docs/PDF/*.pdf
          find . -type f -name "*.pkl" -delete
          find . -type f -name "*.pdf" -delete

          git add -A
          git commit -m "chore: sync to HF Space without large binary artifacts"

          # Recreate remote cleanly and force push the clean branch as Space main.
          git remote get-url huggingface >/dev/null 2>&1 && git remote remove huggingface
          git remote add huggingface https://Oxyraptor:$HF_TOKEN@huggingface.co/spaces/Oxyraptor/Heat-sink-backend
          
          git config lfs.allowincompletepush true
          git push --force huggingface hf-space-sync:main
